<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AERO PASS</title>
    <style>
        /* デザイン設定は前回を継承（一部調整） */
        :root { --ana-navy: #003399; --ana-blue: #007FFF; --glass: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: linear-gradient(135deg, #001f5c, #003399); color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .glass-panel { background: var(--glass); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        .screen { display: none; flex: 1; overflow-y: auto; padding: 20px 20px 100px 20px; }
        .active { display: block; }
        #launch-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; background: rgba(0,31,92,0.9); }
        #bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: white; display: none; justify-content: space-around; align-items: center; border-top: 3px solid var(--ana-navy); z-index: 50; }
        .nav-item { color: #666; font-size: 10px; text-align: center; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--ana-navy); font-weight: bold; }
        input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.3); border-radius: 10px; padding: 12px; color: white; margin-top: 5px; outline: none; }
        .btn { background: var(--ana-blue); color: white; border: none; padding: 15px; border-radius: 30px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .header-logo { font-size: 28px; font-style: italic; font-weight: bold; text-align: center; margin-bottom: 20px; letter-spacing: 2px; }
    </style>
</head>
<body onload="initApp()">

    <div id="launch-screen">
        <div class="header-logo">AERO PASS</div>
        <div class="glass-panel" style="width: 90%; max-width: 350px;">
            <p style="font-size: 12px; margin-bottom: 15px; text-align: center;">TODAY'S FLIGHT PLAN</p>
            <input type="text" id="targetTime" placeholder="目標勉強時間（例：6時間）">
            <input type="text" id="keyTask" placeholder="重点課題（例：物理 20問）">
            <button class="btn" onclick="takeOff()">Take Off!</button>
        </div>
    </div>

    <div id="home" class="screen">
        <div class="header-logo">AERO PASS</div>
        <div class="glass-panel" style="text-align: center;">
            <div style="width: 100px; height: 100px; border-radius: 50%; border: 6px solid var(--ana-blue); margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 20px;">55%</div>
            <p style="margin-top: 10px; font-size: 12px;">現在地の進捗状況</p>
        </div>
        <div class="glass-panel">
            <h3 style="font-size: 14px; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.2);">TODAY'S MISSION</h3>
            <p id="dispTime" style="margin-bottom: 10px;"></p>
            <p id="dispTask"></p>
        </div>
        <button onclick="clearData()" style="font-size: 10px; color: #ccc; background: none; border: none; text-decoration: underline; margin-top: 20px;">フライトデータをリセット</button>
    </div>

    <div id="schedule" class="screen"><div class="header-logo">AERO PASS</div><div class="glass-panel"><h3>SCHEDULE</h3></div></div>
    <div id="mock" class="screen"><div class="header-logo">AERO PASS</div><div class="glass-panel"><h3>MOCK EXAMS</h3></div></div>
    <div id="progress" class="screen"><div class="header-logo">AERO PASS</div><div class="glass-panel"><h3>PROGRESS DB</h3></div></div>
    <div id="settings" class="screen"><div class="header-logo">AERO PASS</div><div class="glass-panel"><h3>MY PAGE</h3></div></div>

    <nav id="bottom-nav">
        <div class="nav-item active" onclick="showPage('home', this)">🏠<br>ホーム</div>
        <div class="nav-item" onclick="showPage('schedule', this)">📅<br>計画</div>
        <div class="nav-item" onclick="showPage('mock', this)">🏆<br>模試</div>
        <div class="nav-item" onclick="showPage('progress', this)">📊<br>進捗DB</div>
        <div class="nav-item" onclick="showPage('settings', this)">👤<br>設定</div>
    </nav>

    <script>
        // アプリ起動時の処理
        function initApp() {
            const savedTime = localStorage.getItem('targetTime');
            const savedTask = localStorage.getItem('keyTask');

            if (savedTime && savedTask) {
                // 保存されたデータがあれば反映してホームへ直行
                document.getElementById('dispTime').innerText = "目標時間：" + savedTime;
                document.getElementById('dispTask').innerText = "重点課題：" + savedTask;
                document.getElementById('launch-screen').style.display = 'none';
                document.getElementById('bottom-nav').style.display = 'flex';
                showPage('home', document.querySelector('.nav-item'));
            }
        }

        // 離陸ボタン（保存処理）
        function takeOff() {
            const time = document.getElementById('targetTime').value;
            const task = document.getElementById('keyTask').value;

            if(!time || !task) return alert('フライトプランを入力してください');

            // ローカルストレージに保存
            localStorage.setItem('targetTime', time);
            localStorage.setItem('keyTask', task);

            // 画面表示
            document.getElementById('dispTime').innerText = "目標時間：" + time;
            document.getElementById('dispTask').innerText = "重点課題：" + task;
            
            document.getElementById('launch-screen').style.display = 'none';
            document.getElementById('bottom-nav').style.display = 'flex';
            showPage('home', document.querySelector('.nav-item'));
        }

        function showPage(pageId, element) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
        }

        function clearData() {
            if(confirm('本日のフライトデータを削除して起動画面に戻りますか？')) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
