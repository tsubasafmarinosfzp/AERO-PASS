<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AERO PASS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --ana-navy: #002D72; --ana-blue: #007FFF;
            --glass: rgba(255, 255, 255, 0.15); --glass-border: rgba(255, 255, 255, 0.3);
            --panel-dark: rgba(0, 20, 50, 0.7);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(135deg, #051937, #004d7a); color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* 起動画面 (Image 5) */
        #launch-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; background: url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1000&q=80') center/cover; }
        #launch-screen::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,34,102,0.6); z-index: -1; }
        .launch-logo { font-size: 42px; font-style: italic; font-weight: 900; text-shadow: 0 4px 20px rgba(0,0,0,0.8); margin-bottom: 30px; }

        /* コンテンツエリア */
        .screen { display: none; flex: 1; overflow-y: auto; padding: 20px 20px 100px 20px; animation: fadeIn 0.4s; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .panel { background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; margin-bottom: 20px; }

        /* ボトムナビ (白背景) */
        #bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; background: #ffffff; display: none; justify-content: space-around; align-items: center; border-top: 2px solid var(--ana-navy); z-index: 150; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: #888; font-size: 10px; text-align: center; flex: 1; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: var(--ana-navy); font-weight: bold; }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }

        /* 計器 (Image 4 左) */
        .dials { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin-bottom: 20px; }
        .dial { background: #111; border: 2px solid #555; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 10px #000; }
        .dial-lg { width: 80px; height: 80px; font-size: 30px; border-color: var(--ana-blue); }

        /* 滑走路・本棚 (Image 2) */
        .runway { height: 35px; background: #222; border: 1px dashed rgba(255,255,255,0.3); margin-bottom: 10px; position: relative; border-radius: 4px; display: flex; align-items: center; }
        .bookshelf { height: 110px; background: #6F4E37; border-bottom: 10px solid #3d2b1f; display: flex; align-items: flex-end; padding: 0 10px; gap: 4px; border-radius: 4px; }
        .book { width: 22px; height: 80px; background: #e74c3c; color: white; writing-mode: vertical-rl; font-size: 9px; text-align: center; border-left: 2px solid rgba(255,255,255,0.2); }

        /* ボタン・入力 */
        .btn { background: var(--ana-blue); color: white; border: none; padding: 16px; border-radius: 40px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px; color: white; margin-top: 10px; outline: none; }
    </style>
</head>
<body onload="initApp()">

    <div id="launch-screen">
        <h1 class="launch-logo">AERO PASS</h1>
        <div class="panel" style="width: 85%; max-width: 380px;">
            <p style="text-align:center; font-size: 11px; letter-spacing: 2px; margin-bottom:15px;">TODAY'S FLIGHT PLAN</p>
            <input type="text" id="targetTime" placeholder="目標勉強時間（例: 6時間）">
            <input type="text" id="keyTask" placeholder="重点課題（例: 物理の電磁気）">
            <button class="btn" onclick="takeOff()">Take Off!</button>
        </div>
    </div>

    <div id="home" class="screen">
        <h1 style="text-align:center; font-style:italic; margin-bottom:20px;">AERO PASS</h1>
        <div class="dials"><div class="dial dial-lg">✈️</div></div>
        <div class="panel" style="text-align:center; background: var(--panel-dark);">
            <div style="width:100px; height:100px; border-radius:50%; border:8px solid var(--ana-blue); border-top-color:transparent; margin:0 auto; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:bold;">55%</div>
            <p style="margin-top:10px; font-size:11px;">ANA Tntpn/White 進捗 : 53%</p>
        </div>
        <div class="panel">
            <p id="dispTime" style="font-weight:bold; font-size:18px;"></p>
            <p id="dispTask" style="font-size:13px; opacity:0.8; margin-top:5px;"></p>
        </div>
    </div>

    <div id="progress" class="screen">
        <h2 style="text-align:center; font-size:18px; margin-bottom:20px;">進捗管理<br><small style="font-size:12px;">(滑走路進行状況図)</small></h2>
        <div class="panel" style="background: rgba(0,0,0,0.3);">
            <div class="runway"><div style="position:absolute; left:65%; font-size:20px;">✈️</div></div>
            <div class="runway"><div style="position:absolute; left:30%; font-size:20px;">✈️</div></div>
        </div>
        <div class="bookshelf">
            <div class="book">青チャート</div><div class="book" style="background:#3498db; height:90px;">物理のエッセンス</div><div class="book" style="background:#e67e22; height:75px;">英語過去問</div>
        </div>
    </div>

    <nav id="bottom-nav">
        <div class="nav-item active" onclick="showPage('home', this)"><span class="nav-icon">🏠</span>ホーム</div>
        <div class="nav-item" onclick="showPage('progress', this)"><span class="nav-icon">📊</span>進捗DB</div>
    </nav>

    <script>
        const API_KEY = 'ここにあなたのAPIキーを入れる'; 
        function initApp() {
            const savedTime = localStorage.getItem('targetTime');
            const savedTask = localStorage.getItem('keyTask');
            if (savedTime && savedTask) {
                document.getElementById('dispTime').innerText = "目標：" + savedTime;
                document.getElementById('dispTask').innerText = "重点：" + savedTask;
                document.getElementById('launch-screen').style.display = 'none';
                document.getElementById('bottom-nav').style.display = 'flex';
                showPage('home', document.querySelector('.nav-item'));
            }
        }
        async function takeOff() {
            const time = document.getElementById('targetTime').value;
            const task = document.getElementById('keyTask').value;
            if(!time || !task) return alert('入力してください');
            localStorage.setItem('targetTime', time);
            localStorage.setItem('keyTask', task);
            location.reload();
        }
        function showPage(pageId, element) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
