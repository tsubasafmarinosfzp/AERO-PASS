<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AERO PASS</title>
    <style>
        :root { --ana-navy: #003399; --ana-blue: #007FFF; --glass: rgba(255,255,255,0.15); }
        body { 
            background: linear-gradient(rgba(0,31,92,0.8), rgba(0,31,92,0.8)), url('https://images.unsplash.com/photo-1534067783941-51c9c23ecefd?q=80&w=1000&auto=format&fit=crop') center/cover;
            color: white; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .panel { background: var(--glass); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.3); border-radius: 24px; padding: 30px; width: 90%; max-width: 400px; text-align: center; }
        .btn { background: var(--ana-blue); color: white; border: none; padding: 15px; border-radius: 30px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="panel">
        <h1 style="font-style: italic; margin-bottom: 20px;">AERO PASS</h1>
        <p>TODAY'S FLIGHT PLAN</p>
        <button class="btn" onclick="alert('準備完了！')">Take Off!</button>
    </div>
</body>
</html>
