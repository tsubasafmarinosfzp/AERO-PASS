<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AERO PASS</title>
    <style>
        :root {
            --ana-navy: #003399;
            --ana-blue: #007FFF;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #001f5c, #003399);
            color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }
        /* グラスパネル共通設定 */
        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; margin-bottom: 15px;
        }
        /* 画面制御 */
        .screen { display: none; flex: 1; overflow-y: auto; padding: 20px 20px 100px 20px; animation: fadeIn 0.3s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 1. 起動画面（ナビなし） */
        #launch-screen {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1000&auto=format&fit=crop') center/cover;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
        }
        #launch-screen::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,51,153,0.5); z-index: -1; }

        /* ボトムナビゲーション（共通） */
        #bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: white;
            display: none; justify-content: space-around; align-items: center; border-top: 3px solid var(--ana-navy); z-index: 50;
        }
        .nav-item { color: #666; font-size: 10px; text-align: center; flex: 1; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: var(--ana-navy); font-weight: bold; }
        .nav-icon { font-size: 24px; margin-bottom: 2px; }

        /* 入力パーツ */
        input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 10px; padding: 12px; color: white; margin-top: 5px; }
        .btn { background: var(--ana-blue); color: white; border: none; padding: 15px; border-radius: 30px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        
        .header-logo { font-size: 28px; font-style: italic; font-weight: bold; text-align: center; margin-bottom: 20px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="launch-screen" class="active">
        <div class="header-logo">AERO PASS</div>
        <div class="glass-panel" style="width: 90%; max-width: 350px;">
            <p style="font-size: 12px; margin-bottom: 15px; text-align: center;">TODAY'S FLIGHT PLAN</p>
            <div style="margin-bottom: 15px; text-align: left;">
                <label style="font-size: 10px; color: #ccc;">TARGET STUDY TIME (HOURS)</label>
                <input type="text" id="targetTime" placeholder="例：6時間">
            </div>
            <div style="text-align: left;">
                <label style="font-size: 10px; color: #ccc;">TODAY'S KEY TASK</label>
                <input type="text" id="keyTask" placeholder="例：物理の電磁気 20問">
            </div>
            <button class="btn" onclick="takeOff()">Take Off!</button>
        </div>
    </div>

    <div id="home" class="screen">
        <div class="header-logo">AERO PASS</div>
        <div class="glass-panel" style="text-align: center;">
            <div style="width: 120px; height: 120px; border-radius: 50%; border: 8px solid var(--ana-blue); margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 24px;">55%</div>
            <p style="margin-top: 10px; font-size: 12px;">ANA Tntpn/White 進捗 : 53%</p>
        </div>
        <div class="glass-panel">
            <h3>今日の目標</h3>
            <p id="dispTime" style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; margin: 10px 0;"></p>
            <p id="dispTask" style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;"></p>
        </div>
    </div>

    <div id="schedule" class="screen">
        <div class="header-logo">AERO PASS</div>
        <div class="glass-panel"><h3>スケジュール</h3><p>カレンダーUI 準備中...</p></div>
    </div>

    <div id="progress" class="screen">
        <div class="header-logo">AERO PASS</div>
        <div class="glass-panel"><h3>進捗管理 (滑走路)</h3><p>滑走路アニメーション 準備中...</p></div>
    </div>

    <div id="mock" class="screen">
        <div class="header-logo">AERO PASS</div>
        <div class="glass-panel">
            <h3>模試記録 (FDRモード)</h3>
            <input type="text" placeholder="英語スコア">
            <input type="text" placeholder="総合Iスコア">
            <button class="btn" style="padding: 10px; font-size: 14px;">記録を保存</button>
        </div>
    </div>

    <div id="settings" class="screen">
        <div class="header-logo">AERO PASS</div>
        <div class="glass-panel"><h3>設定 (Maintenance)</h3><p>ユーザー：翼くん</p></div>
    </div>

    <nav id="bottom-nav">
        <div class="nav-item active" onclick="showPage('home', this)"><div class="nav-icon">🏠</div>ホーム</div>
        <div class="nav-item" onclick="showPage('schedule', this)"><div class="nav-icon">📅</div>計画</div>
        <div class="nav-item" onclick="showPage('mock', this)"><div class="nav-icon">🏆</div>模試</div>
        <div class="nav-item" onclick="showPage('progress', this)"><div class="nav-icon">📊</div>進捗DB</div>
        <div class="nav-item" onclick="showPage('settings', this)"><div class="nav-icon">👤</div>マイページ</div>
    </nav>

    <script>
        function takeOff() {
            // 値を取得して反映
            document.getElementById('dispTime').innerText = "目標時間：" + document.getElementById('targetTime').value;
            document.getElementById('dispTask').innerText = "重点課題：" + document.getElementById('keyTask').value;
            
            // 画面切り替え
            document.getElementById('launch-screen').classList.remove('active');
            document.getElementById('bottom-nav').style.display = 'flex';
            showPage('home', document.querySelector('.nav-item'));
        }

        function showPage(pageId, element) {
            // 全画面を非表示
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            // 選択画面を表示
            document.getElementById(pageId).classList.add('active');
            // ナビの見た目更新
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
